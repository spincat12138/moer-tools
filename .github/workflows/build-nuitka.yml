name: Build Windows executables

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: moer
            script: moer.py
          - name: moer_lite
            script: moer_lite.py

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip "uncompyle6==3.9.3" "Pillow==11.3.0"

      - name: Convert WebP logo to Windows icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          @'
          from PIL import Image

          image = Image.open("logo.webp").convert("RGBA")
          image.thumbnail((256, 256), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (256, 256), (255, 255, 255, 255))
          canvas.alpha_composite(
              image,
              ((256 - image.width) // 2, (256 - image.height) // 2),
          )
          canvas.save(
              "build/logo.ico",
              format="ICO",
              sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)],
          )
          '@ | python -

      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@99c9d3ab258c7008c0604617d925574101327e5d
        with:
          script-name: ${{ matrix.script }}
          mode: onefile
          output-dir: build/${{ matrix.name }}
          output-file: ${{ matrix.name }}.exe
          windows-console-mode: force
          product-name: ${{ matrix.name }}
          product-version: "1.0.0"
          file-version: "1.0.0"
          file-description: ${{ matrix.name }} executable
          windows-icon-from-ico: build/logo.ico
          assume-yes-for-downloads: true

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-windows
          path: build/${{ matrix.name }}/${{ matrix.name }}.exe
          if-no-files-found: error
          retention-days: 14
