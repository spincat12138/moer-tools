name: Build Windows executables

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: moer
            script: moer.py
          - name: autobattle
            script: autobattle.py

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip "uncompyle6==3.9.3"

      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@99c9d3ab258c7008c0604617d925574101327e5d
        with:
          script-name: ${{ matrix.script }}
          mode: onefile
          output-dir: build/${{ matrix.name }}
          output-file: ${{ matrix.name }}.exe
          windows-console-mode: force
          product-name: ${{ matrix.name }}
          file-description: ${{ matrix.name }} executable
          assume-yes-for-downloads: true

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-windows
          path: build/${{ matrix.name }}/${{ matrix.name }}.exe
          if-no-files-found: error
          retention-days: 14
